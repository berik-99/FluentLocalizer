<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101826" />
    <meta name="description" content="FluentLocalizer is a .NET localization library with fluent APIs and MessageFormat templates. Explore the packages and try the real formatter in your browser." />
    <title>FluentLocalizer · Localization that reads like your code</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script src="js/site.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/playground.css" />
    <link rel="stylesheet" href="css/docs.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot" role="progressbar" aria-label="Loading FluentLocalizer">
            <svg class="loading-progress" aria-hidden="true">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <img class="boot-logo" src="favicon.svg" alt="" width="44" height="44" />
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        <span class="error-message">An unhandled error has occurred.</span>
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">×</button>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
