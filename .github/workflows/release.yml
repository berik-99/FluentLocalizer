name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and pack
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tagged commit is in main
        shell: pwsh
        env:
          TAGGED_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          git merge-base --is-ancestor $env:TAGGED_COMMIT origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The tagged commit $env:TAGGED_COMMIT is not contained in origin/main."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Derive package version from tag
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.Substring(1)

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Tag '$env:TAG_NAME' must be vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix."
          }

          "value=$version" >> $env:GITHUB_OUTPUT

          $prerelease = $version.Contains('-')
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore FluentLocalizer.slnx

      - name: Build
        run: dotnet build FluentLocalizer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FluentLocalizer.slnx --configuration Release --no-build --no-restore

      - name: Pack library projects
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $packageDirectory = Join-Path $PWD 'artifacts/packages'
          New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null

          $projects = foreach ($project in Get-ChildItem -Path 'Sources' -Recurse -Filter '*.csproj') {
            $isPackable = dotnet msbuild $project.FullName -getProperty:IsPackable

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            if (($isPackable | Out-String).Trim() -eq 'true') {
              $project
            }
          }

          if (-not $projects) {
            throw 'No packable library projects were found under Sources.'
          }

          foreach ($project in $projects) {
            dotnet pack $project.FullName `
              --configuration Release `
              --no-build `
              --no-restore `
              -p:PackageVersion=$env:PACKAGE_VERSION `
              --output $packageDirectory

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    name: Publish NuGet packages and GitHub Release
    needs: build
    runs-on: windows-latest
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: artifacts/packages

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Get NuGet publishing credentials
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem -Path 'artifacts/packages' -Filter '*.nupkg' |
            Where-Object { $_.Name -notlike '*.snupkg' }

          if (-not $packages) {
            throw 'No NuGet packages were produced.'
          }

          foreach ($package in $packages) {
            Write-Host "Publishing $($package.Name)..."

            dotnet nuget push $package.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key $env:NUGET_API_KEY `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          generate_release_notes: true
          files: artifacts/packages/*
